variables:
  UCS_VERSION: "5.2-6"

include:
  - project: "univention/dev/nubus-for-k8s/common-ci"
    ref: "v1.66.2"
    file:
      - "defaults/stages.yaml"
      - "defaults/nubus-workflow.yaml"
      - "jobs/lint-pre-commit.yaml"
      - "jobs/lint-commit-messages.yaml"
      - "jobs/semantic-release-env.yaml"
      - "jobs/check-debian-updates.yaml"
      # - "templates/sonarqube.yaml"

  # TODO: Change back after merging ci-components
  - component: "$CI_SERVER_FQDN/univention/dev/tooling/ci-components/debian-aptly@jconde-debian-folder"
    inputs:
      pkg-dir: "."
      deb-image: "gitregistry.knut.univention.de/univention/dev/tooling/ci-components/deb-builder-5.2:jconde-debian-folder-d2c5a51f"
  # TODO: Change back after merging ci-components
  - component: "$CI_SERVER_FQDN/univention/dev/tooling/ci-components/debian-errata-build@jconde-debian-folder"
    inputs:
      debian-package: "nubus-portal"
      pkg-dir: "."

build-deb:
  needs:
    - job: "prepare-aptly"
    - job: "pre-semantic-release"
      artifacts: true

lint-pre-commit:
  before_script:
    - |
      # Compose lint would fail without the referenced env files
      cp docker/.env.example docker/.env
      cp docker/.env.keycloak.example docker/.env.keycloak
      cp docker/.env.consumer.example docker/.env.consumer
      cp docker/.env.umc-gateway.example docker/.env.umc-gateway
      cp docker/.env.umc-server.example docker/.env.umc-server

trigger-frontend:
  stage: "trigger"
  needs:
    - job: "pre-semantic-release"
      artifacts: true
  variables:
    RELEASE_VERSION: "${RELEASE_VERSION}"
    PUBLIC_RELEASE: "${PUBLIC_RELEASE}"
    SR_NO_RELEVANT_CHANGE: "${SR_NO_RELEVANT_CHANGE}"
  trigger:
    strategy: "depend"
    include:
      - local: "frontend/.gitlab-ci.yml"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: "never"
    - if: "$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH"
      when: "always"
    - changes: &portal-frontend-changes
        - "frontend/**/*"
        - "tests/**/*"
        - "helm/portal-frontend/**/*"
        - "docker/portal-asset-loader/*"
        # TODO: Drop once the deb stops pinning the image tags. The deb pins
        # both images to RELEASE_VERSION, so anything that rebuilds the deb
        # must rebuild the images, or the deb pins a tag that was never pushed.
        - "debian/**/*"
        - "ucs/**/*"

trigger-portal-server:
  stage: "trigger"
  needs:
    - job: "pre-semantic-release"
      artifacts: true
  variables:
    RELEASE_VERSION: "${RELEASE_VERSION}"
    PUBLIC_RELEASE: "${PUBLIC_RELEASE}"
    SR_NO_RELEVANT_CHANGE: "${SR_NO_RELEVANT_CHANGE}"
  trigger:
    strategy: "depend"
    include:
      - local: "portal-server/.gitlab-ci.yml"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: "never"
    - if: "$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH"
      when: "always"
    - changes: &portal-server-changes
        - "docker/portal-server/**/*"
        - "docker/portal-consumer/**/*"
        - "docker/portal-extension/**/*"
        - "helm/portal-server/**/*"
        - "helm/portal-consumer/**/*"
        - "portal_consumer/**/*"
        - "portal-server/**/*"
        - "python/**/*"
        - "setup.py"
        - "tests/**/*"
        - "udm/**/*"
        - "unittests/**/*"
        - "univention-portal"
        - "univention-portal-server"
        - "requirements.txt"
        # TODO: Drop once the deb stops pinning the image tags. The deb pins
        # both images to RELEASE_VERSION, so anything that rebuilds the deb
        # must rebuild the images, or the deb pins a tag that was never pushed.
        - "debian/**/*"
        - "ucs/**/*"

check-debian-updates:
  parallel:
    matrix:
      - IMAGE_NAME: "portal-server"
      - IMAGE_NAME: "portal-frontend"
      - IMAGE_NAME: "portal-consumer"
  before_script:
    - |
      if [[ "${USERNAME}" != "root" ]]; then
        echo "ERROR: running as ${USERNAME} but root is requiered"
      fi

