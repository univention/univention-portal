---
kind: "ConfigMap"
apiVersion: "v1"
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- if .Values.additionalAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.additionalAnnotations "context" . ) | nindent 4 }}
  {{- end }}
data:
  DOMAIN_NAME: {{ include "portal-consumer.ldapDomainName" . | quote }}
  ENVIRONMENT: "{{ .Values.portalConsumer.environment }}"
  LDAP_BASE_DN: {{ required "The parameter \"portal-consumer.ldapBaseDn\" is required." (include "portal-consumer.ldapBaseDn" .) | quote }}
  LDAP_HOST: {{ include "portal-consumer.ldap.connection.host" . | quote }}
  LDAP_HOST_DN: {{ tpl ( required "The parameter \"ldap.auth.bindDn\" is required." .Values.ldap.auth.bindDn ) . | quote }}
  LDAP_PORT: {{ include "portal-consumer.ldap.connection.port" . | quote }}
  LOG_LEVEL: {{ required "The parameter \".Values.portalConsumer.logLevel\" is required." .Values.portalConsumer.logLevel | quote }}
  MAX_ACKNOWLEDGEMENT_RETRIES: {{ required "The parameter \".Values.provisioningApi.config.maxAcknowledgementRetries\" is required." .Values.provisioningApi.config.maxAcknowledgementRetries | quote }}
  PORTAL_DEFAULT_DN: {{ include "portal-consumer.portalDefaultDn" . | quote }}
  PORTAL_CONSUMER_LOG_STREAM: "true"
  PORTAL_ASSETS_BASE_URL: {{ .Values.portalConsumer.assetsBaseUrl | quote }}
  PORTAL_SERVER_ADMIN_GROUP: {{ include "portal-consumer.adminGroup" . | quote }}
  PORTAL_SERVER_ASSETS_ROOT_PATH: "{{ .Values.portalConsumer.assetsRootPath }}"
  PORTAL_SERVER_AUTH_MODE: {{ include "portal-consumer.authMode" . | quote }}
  PORTAL_SERVER_EDITABLE: "{{ .Values.portalConsumer.editable }}"
  PORTAL_SERVER_PORT: "{{ .Values.portalConsumer.port }}"
  PORTAL_SERVER_UCS_INTERNAL_PATH: {{ required "The parameter \"portalConsumer.ucsInternalPath\" is required." .Values.portalConsumer.ucsInternalPath | quote }}
  PORTAL_SERVER_UMC_GET_URL: "{{- tpl (required "The parameter \"portalConsumer.umcGetUrl\" is required." .Values.portalConsumer.umcGetUrl) . -}}"
  PORTAL_SERVER_UMC_SESSION_URL: "{{- tpl (required "The parameter \"portalConsumer.umcSessionUrl\" is required." .Values.portalConsumer.umcSessionUrl) . -}}"
  {{- $udmConnectionUrl := required
        "The UDM Rest API connection has to be configured, udm.connection.url."
        (coalesce .Values.udm.connection.url .Values.global.udm.connection.url) }}
  PORTAL_UDM_API_URL: {{ tpl $udmConnectionUrl . | quote }}
  {{- $udmAuthUsername := required "A UDM username has to be supplied, see parameter udm.auth." .Values.udm.auth.username }}
  PORTAL_UDM_API_USERNAME: {{ tpl $udmAuthUsername . | quote }}
  PORTAL_UDM_API_PASSWORD_FILE: "/var/secrets/udm_api_password"
  OBJECT_STORAGE_ENDPOINT: {{ tpl ( required "The parameter \"objectStorage.endpoint\" is required." .Values.objectStorage.endpoint ) . | quote }}
  OBJECT_STORAGE_BUCKET: {{ tpl .Values.objectStorage.bucketName . | quote }}
  CA_CERT: "{{ .Values.portalConsumer.caCert }}"
  CA_CERT_FILE: "{{ .Values.portalConsumer.caCertFile }}"
  TLS_MODE: "{{ .Values.portalConsumer.tlsMode }}"
  PROVISIONING_API_BASE_URL: "{{- tpl (required "The Provisioning API connection has to be configured, provisioningApi.connection.url." .Values.provisioningApi.connection.url) . -}}"
  PROVISIONING_API_USERNAME: "{{- tpl (required "A Provisioning API username has to be supplied, see parameter provisioningApi.auth.username" .Values.provisioningApi.auth.username) . -}}"
  NATS_SERVER: {{ .Values.nats.connection.url | quote }}
  NATS_KV_BUCKET: {{ .Values.nats.bucketName | quote }}
  NATS_USER: {{ .Values.nats.auth.user | quote }}
  # TODO: Move NATS_PASSWORD to a proper secret
  NATS_PASSWORD: {{ .Values.nats.auth.password | quote }}
