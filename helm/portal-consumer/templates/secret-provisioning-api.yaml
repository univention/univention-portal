{{- /* Always rendered: the register-consumers Job reads "registration" from it.
       With an existing secret, the spec references that Secret instead of carrying a password. */}}
{{- $existingSecret := .Values.provisioningApi.auth.existingSecret }}
{{- $secretName := include "nubus-common.secrets.name" ( dict "defaultNameSuffix" "provisioning-api" "context" . ) }}
{{- $passwordSecretName := include "nubus-common.secrets.name" ( dict "existingSecret" $existingSecret "defaultNameSuffix" "provisioning-api" "context" . ) }}
{{- $passwordSecretKey := include "nubus-common.secrets.key" ( dict "existingSecret" $existingSecret "key" "password" "context" . ) }}
{{- $username := tpl .Values.provisioningApi.auth.username . }}
{{- if ($existingSecret).name }}
{{- if eq $existingSecret.name $secretName }}
{{- fail (printf "provisioningApi.auth.existingSecret.name must not be %q: the chart renders the subscription spec into a Secret of that name" $secretName) }}
{{- end }}
{{- end }}
---
kind: "Secret"
apiVersion: "v1"
metadata:
  name: {{ $secretName | quote }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- $extraAnnotations := dict }}
  {{- if (.Values.global.secrets).keep }}
    {{- $_ := set $extraAnnotations "helm.sh/resource-policy" "keep" }}
  {{- end }}
  {{- include "nubus-common.annotations.render" ( dict
    "values" ( list $extraAnnotations .Values.additionalAnnotations )
    "context" . )
    | nindent 2 }}
stringData:
  {{- if not ($existingSecret).name }}
  {{- $password := include "nubus-common.secrets.passwords.manage"
    (dict
      "secret" $secretName
      "key" "password"
      "username" "nubus"
      "site" "portal-consumer"
      "providedValues" (list "provisioningApi.auth.password")
      "context" .
    )
  }}
  password: {{ $password | quote }}
  {{- end }}
  registration: |
    {
      "name": {{ $username | toJson }},
      "realms_topics": [
        {
          "realm": "udm",
          "topic": "groups/group"
        },
        {
          "realm": "udm",
          "topic": "portals/portal"
        },
        {
          "realm": "udm",
          "topic": "portals/category"
        },
        {
          "realm": "udm",
          "topic": "portals/entry"
        },
        {
          "realm": "udm",
          "topic": "portals/folder"
        },
        {
          "realm": "udm",
          "topic": "portals/announcement"
        }
      ],
      "request_prefill": false,
      "password": {"kubernetesSecret": {"name": {{ $passwordSecretName | toJson }}, "key": {{ $passwordSecretKey | toJson }}}}
    }
