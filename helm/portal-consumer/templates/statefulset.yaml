{{ $podSecurityContext := omit .Values.podSecurityContext "enabled" }}
{{ $containerSecurityContext := omit .Values.containerSecurityContext "enabled" }}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" $ ) | nindent 4 }}
spec:
  serviceName: {{ include "common.names.fullname" . }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" ( dict "customLabels" .Values.additionalLabels "context" $ ) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config-common: {{ include (print $.Template.BasePath "/configmap-common.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" $ ) | nindent 8 }}
    spec:
      {{- with .Values.portalConsumer.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        {{- $podSecurityContext | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      initContainers:
        - name: wait-for-ldap
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext:
            {{- $containerSecurityContext | toYaml | nindent 12 }}
          {{- end }}
          command: ["/bin/bash", "/scripts/wait-for-ldap.sh"]
          image: "{{ coalesce .Values.waitForDependency.image.registry .Values.global.imageRegistry }}/{{ .Values.waitForDependency.image.repository }}:{{ .Values.waitForDependency.image.tag }}"
          imagePullPolicy: {{ coalesce .Values.waitForDependency.image.imagePullPolicy .Values.global.imagePullPolicy | quote }}
          env:
            {{- with .Values.waitForDependency.extraEnvVars }}
            {{- . | toYaml | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-common" (include "common.names.fullname" .) }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            {{- if (include "nubus-common.secrets.name" (dict "existingSecret" .Values.ldap.auth.existingSecret "defaultNameSuffix" "credentials" "context" .)) }}
            - name: {{ printf "%s-credentials-volume" (include "common.names.fullname" .) }}
              mountPath: "{{ .Values.portalConsumer.secretMountPath }}/machine_secret"
              subPath: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.ldap.auth.existingSecret "key" "password") | quote }}
              readOnly: true
            - name: {{ printf "%s-credentials-volume" (include "common.names.fullname" .) }}
              mountPath: "/etc/machine.secret"
              subPath: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.ldap.auth.existingSecret "key" "password") | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.ldap.tls.enabled }}
            - name: {{ printf "%s-tls-volume" (include "common.names.fullname" .) }}
              mountPath: "{{ .Values.portalConsumer.secretMountPath }}/ca_cert"
              subPath: ca.crt
              readOnly: true
            - name: {{ printf "%s-tls-volume" (include "common.names.fullname" .) }}
              mountPath: "{{ .Values.portalConsumer.secretMountPath }}/cert_pem"
              subPath: cert.pem
              readOnly: true
            - name: {{ printf "%s-tls-volume" (include "common.names.fullname" .) }}
              mountPath: "{{ .Values.portalConsumer.secretMountPath }}/private_key"
              subPath: tls.key
              readOnly: true
            {{- end }}
            {{- if .Values.waitForDependency.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.waitForDependency.extraVolumeMounts "context" .) | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resourcesWaitForDependency | nindent 12 }}
        - name: wait-for-udm
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext:
            {{- $containerSecurityContext | toYaml | nindent 12 }}
          {{- end }}
          command: ["/bin/bash", "/scripts/wait-for-udm.sh"]
          image: "{{ coalesce .Values.waitForDependency.image.registry .Values.global.imageRegistry }}/{{ .Values.waitForDependency.image.repository }}:{{ .Values.waitForDependency.image.tag }}"
          imagePullPolicy: {{ coalesce .Values.waitForDependency.image.imagePullPolicy .Values.global.imagePullPolicy | quote }}
          env:
            {{- with .Values.waitForDependency.extraEnvVars }}
            {{- . | toYaml | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-common" (include "common.names.fullname" .) }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            {{- if (include "nubus-common.secrets.name" (dict "existingSecret" .Values.ldap.auth.existingSecret "defaultNameSuffix" "credentials" "context" .)) }}
            - name: {{ printf "%s-credentials-volume" (include "common.names.fullname" .) }}
              mountPath: "{{ .Values.portalConsumer.secretMountPath }}/machine_secret"
              subPath: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.ldap.auth.existingSecret "key" "password") | quote }}
              readOnly: true
            - name: {{ printf "%s-credentials-volume" (include "common.names.fullname" .) }}
              mountPath: "/etc/machine.secret"
              subPath: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.ldap.auth.existingSecret "key" "password") | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.ldap.tls.enabled }}
            - name: {{ printf "%s-tls-volume" (include "common.names.fullname" .) }}
              mountPath: "{{ .Values.portalConsumer.secretMountPath }}/ca_cert"
              subPath: ca.crt
              readOnly: true
            - name: {{ printf "%s-tls-volume" (include "common.names.fullname" .) }}
              mountPath: "{{ .Values.portalConsumer.secretMountPath }}/cert_pem"
              subPath: cert.pem
              readOnly: true
            - name: {{ printf "%s-tls-volume" (include "common.names.fullname" .) }}
              mountPath: "{{ .Values.portalConsumer.secretMountPath }}/private_key"
              subPath: tls.key
              readOnly: true
            {{- end }}
            {{- if .Values.waitForDependency.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.waitForDependency.extraVolumeMounts "context" .) | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resourcesWaitForDependency | nindent 12 }}
        - name: wait-for-object-storage
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext:
            {{- $containerSecurityContext | toYaml | nindent 12 }}
          {{- end }}
          command: ["/usr/bin/python3", "/scripts/wait-for-object-store.py"]
          image: "{{ coalesce .Values.portalConsumer.image.registry .Values.global.imageRegistry }}/{{ .Values.portalConsumer.image.repository }}:{{ .Values.portalConsumer.image.tag }}"
          imagePullPolicy: {{ coalesce .Values.portalConsumer.image.imagePullPolicy .Values.global.imagePullPolicy | quote }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-common" (include "common.names.fullname" .) }}
          env:
            - name: OBJECT_STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.objectStorage.auth.existingSecret "defaultNameSuffix" "object-storage" "context" .) | quote }}
                  key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.objectStorage.auth.existingSecret "key" "accessKey") | quote }}
            - name: OBJECT_STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.objectStorage.auth.existingSecret "defaultNameSuffix" "object-storage" "context" .) | quote }}
                  key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.objectStorage.auth.existingSecret "key" "secretKey") | quote }}
            {{- with .Values.waitForDependency.extraEnvVars }}
            {{- . | toYaml | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            {{- if .Values.waitForDependency.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.waitForDependency.extraVolumeMounts "context" .) | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resourcesWaitForDependency | nindent 12 }}
        - name: wait-for-provisioning-api
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext:
            {{- $containerSecurityContext | toYaml | nindent 12 }}
          {{- end }}
          image: "{{ coalesce .Values.waitForDependency.image.registry .Values.global.imageRegistry }}/{{ .Values.waitForDependency.image.repository }}:{{ .Values.waitForDependency.image.tag }}"
          imagePullPolicy: {{ coalesce .Values.waitForDependency.image.imagePullPolicy .Values.global.imagePullPolicy | quote }}
          command: ["/bin/bash", "/scripts/wait-for-provisioning-api.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          env:
            - name: PROVISIONING_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.provisioningApi.auth.existingSecret "defaultNameSuffix" "provisioning-api-credentials" "context" .) | quote }}
                  key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.provisioningApi.auth.existingSecret "key" "password") | quote }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-common" (include "common.names.fullname" .) }}
          resources:
            {{- toYaml .Values.resourcesWaitForDependency | nindent 12 }}
        - name: "univention-compatibility"
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext:
            {{- omit .Values.containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          image: "{{ coalesce .Values.portalConsumer.image.registry .Values.global.imageRegistry }}/{{ .Values.portalConsumer.image.repository }}:{{ .Values.portalConsumer.image.tag }}"
          imagePullPolicy: {{ coalesce .Values.portalConsumer.image.imagePullPolicy .Values.global.imagePullPolicy | quote }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-common" (include "common.names.fullname" .) }}
          env:
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/ssl/certs/ca-certificates.crt"
            - name: OBJECT_STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.objectStorage.auth.existingSecret "defaultNameSuffix" "object-storage" "context" .) | quote }}
                  key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.objectStorage.auth.existingSecret "key" "accessKey") | quote }}
            - name: OBJECT_STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.objectStorage.auth.existingSecret "defaultNameSuffix" "object-storage" "context" .) | quote }}
                  key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.objectStorage.auth.existingSecret "key" "secretKey") | quote }}
            - name: PROVISIONING_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.provisioningApi.auth.existingSecret "defaultNameSuffix" "provisioning-api-credentials" "context" .) | quote }}
                  key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.provisioningApi.auth.existingSecret "key" "password") | quote }}
          command:
            - sh
            - -c
            - './50-ldap-setup.envsh; cp -a /etc/univention/* /target/etc/univention/'
          volumeMounts:
            - name: etc-univention-volume
              mountPath: /target/etc/univention
            {{- if (include "nubus-common.secrets.name" (dict "existingSecret" .Values.ldap.auth.existingSecret "defaultNameSuffix" "credentials" "context" .)) }}
            - name: {{ printf "%s-credentials-volume" (include "common.names.fullname" .) }}
              mountPath: "{{ .Values.portalConsumer.secretMountPath }}/machine_secret"
              subPath: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.ldap.auth.existingSecret "key" "password") | quote }}
              readOnly: true
            - name: {{ printf "%s-credentials-volume" (include "common.names.fullname" .) }}
              mountPath: "/etc/machine.secret"
              subPath: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.ldap.auth.existingSecret "key" "password") | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.ldap.tls.enabled }}
            - name: {{ printf "%s-tls-volume" (include "common.names.fullname" .) }}
              mountPath: "{{ .Values.portalConsumer.secretMountPath }}/ca_cert"
              subPath: ca.crt
              readOnly: true
            - name: {{ printf "%s-tls-volume" (include "common.names.fullname" .) }}
              mountPath: "{{ .Values.portalConsumer.secretMountPath }}/cert_pem"
              subPath: cert.pem
              readOnly: true
            - name: {{ printf "%s-tls-volume" (include "common.names.fullname" .) }}
              mountPath: "{{ .Values.portalConsumer.secretMountPath }}/private_key"
              subPath: tls.key
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resourcesWaitForDependency | nindent 12 }}
      containers:
        - name: "portal-consumer"
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext:
            {{- $containerSecurityContext | toYaml | nindent 12 }}
          {{- end }}
          image: "{{ coalesce .Values.portalConsumer.image.registry .Values.global.imageRegistry }}/{{ .Values.portalConsumer.image.repository }}:{{ .Values.portalConsumer.image.tag }}"
          imagePullPolicy: {{ coalesce .Values.portalConsumer.image.imagePullPolicy .Values.global.imagePullPolicy | quote }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-common" (include "common.names.fullname" .) }}
          env:
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/ssl/certs/ca-certificates.crt"
            - name: OBJECT_STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.objectStorage.auth.existingSecret "defaultNameSuffix" "object-storage" "context" .) | quote }}
                  key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.objectStorage.auth.existingSecret "key" "accessKey") | quote }}
            - name: OBJECT_STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.objectStorage.auth.existingSecret "defaultNameSuffix" "object-storage" "context" .) | quote }}
                  key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.objectStorage.auth.existingSecret "key" "secretKey") | quote }}
            - name: PROVISIONING_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.provisioningApi.auth.existingSecret "defaultNameSuffix" "provisioning-api-credentials" "context" .) | quote }}
                  key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.provisioningApi.auth.existingSecret "key" "password") | quote }}
            {{- with .Values.extraEnvVars }}
            {{- . | toYaml | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: usr-lib-univention-portal-config-volume
              mountPath: /usr/lib/univention-portal/config
            - name: etc-univention-volume
              mountPath: /etc/univention
              readOnly: true
            - name: group-membership-cache
              mountPath: /usr/share/univention-group-membership-cache/caches
            {{- if (include "nubus-common.secrets.name" (dict "existingSecret" .Values.ldap.auth.existingSecret "defaultNameSuffix" "credentials" "context" .)) }}
            - name: {{ printf "%s-credentials-volume" (include "common.names.fullname" .) }}
              mountPath: "{{ .Values.portalConsumer.secretMountPath }}/machine_secret"
              subPath: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.ldap.auth.existingSecret "key" "password") | quote }}
              readOnly: true
            - name: {{ printf "%s-credentials-volume" (include "common.names.fullname" .) }}
              mountPath: "/etc/machine.secret"
              subPath: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.ldap.auth.existingSecret "key" "password") | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.ldap.tls.enabled }}
            - name: {{ printf "%s-tls-volume" (include "common.names.fullname" .) }}
              mountPath: "{{ .Values.portalConsumer.secretMountPath }}/ca_cert"
              subPath: ca.crt
              readOnly: true
            - name: {{ printf "%s-tls-volume" (include "common.names.fullname" .) }}
              mountPath: "{{ .Values.portalConsumer.secretMountPath }}/cert_pem"
              subPath: cert.pem
              readOnly: true
            - name: {{ printf "%s-tls-volume" (include "common.names.fullname" .) }}
              mountPath: "{{ .Values.portalConsumer.secretMountPath }}/private_key"
              subPath: tls.key
              readOnly: true
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumeMounts "context" .) | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: "usr-lib-univention-portal-config-volume"
          emptyDir: {}
        - name: "etc-univention-volume"
          emptyDir: {}
        - name: "scripts"
          configMap:
            defaultMode: 0555
            name: {{ printf "%s-scripts" (include "common.names.fullname" .) }}
        {{- if (include "nubus-common.secrets.name" (dict "existingSecret" .Values.ldap.auth.existingSecret "defaultNameSuffix" "credentials" "context" .)) }}
        - name: {{ printf "%s-credentials-volume" (include "common.names.fullname" .) }}
          secret:
            defaultMode: 0400
            secretName: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.ldap.auth.existingSecret "defaultNameSuffix" "credentials" "context" .) | quote }}
        {{- end }}
        {{- if .Values.ldap.tls.enabled }}
        - name: {{ printf "%s-tls-volume" (include "common.names.fullname" .) }}
          secret:
            defaultMode: 0400
            secretName: {{ include "nubus-common.secrets.name" (dict "existingSecret" .Values.ldap.tls.existingSecret "defaultNameSuffix" "tls" "context" .) | quote }}
            items:
              - key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.ldap.tls.existingSecret "key" "ca.crt") | quote }}
                path: ca.crt
              - key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.ldap.tls.existingSecret "key" "tls.crt") | quote }}
                path: tls.crt
              - key: {{ include "nubus-common.secrets.key" (dict "existingSecret" .Values.ldap.tls.existingSecret "key" "tls.key") | quote }}
                path: tls.key
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumes  "context" .) | nindent 8 }}
        {{- end }}
        {{- if .Values.waitForDependency.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.waitForDependency.extraVolumes  "context" .) | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: group-membership-cache
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.persistence.groupMembershipCache.storageClass }}
      storageClassName: {{ .Values.persistence.groupMembershipCache.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.groupMembershipCache.size | required ".Values.persistence.groupMembershipCache.size is required" | quote }}
