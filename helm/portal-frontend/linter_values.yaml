# Dummy values for running the Helm linter on the portal-frontend.
# Run it like this: helm lint -f values.yaml -f linter_values.yaml .


## Application-specific
portalFrontend:
  environment: "staging"
  logLevel: "DEBUG"

udm:
  connection:
    url: "udm-stub-url"
  auth:
    username: "udm-stub-username"
    password: "udm-stub-password"

## Kubernetes ingress
ingress:
  enabled: true
  host: "portal.example.develop.souvap-univention.de"
  ingressClassName: "nginx"
  tls:
    secretName: "portal-tls"

## Istio based
istio:
  enabled: false
  host: "portal.example.develop.souvap-univention.de"

## Container deployment probes
probes:
  liveness:
    enabled: false

  readiness:
    enabled: false

...
