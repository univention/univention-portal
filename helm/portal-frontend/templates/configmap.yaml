---
kind: "ConfigMap"
apiVersion: "v1"
metadata:
  name: "{{ include "common.names.fullname" . }}"
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- if .Values.additionalAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.additionalAnnotations "context" . ) | nindent 4 }}
  {{- end }}
data:
  ENVIRONMENT: "{{ .Values.portalFrontend.environment }}"
  LOG_LEVEL: "{{ .Values.portalFrontend.logLevel }}"
...
---
kind: "ConfigMap"
apiVersion: "v1"
metadata:
  name: {{ printf "%s-nginx" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- if .Values.additionalAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.additionalAnnotations "context" . ) | nindent 4 }}
  {{- end }}
data:
  nginx.conf: |
    worker_processes  auto;
    error_log  /dev/stderr notice;
    pid        /var/run/nginx.pid;
    events {
        worker_connections  1024;
    }
    http {
        server_tokens off;
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';
        access_log  /dev/stdout  main;
        sendfile        on;
        keepalive_timeout  65;
        #gzip  on;
        server {
            listen 80 default_server;
            {{- if not .Values.portalFrontend.nginx.disableIPv6 }}
            listen [::]:80 default_server;
            {{- end }}
            root /var/www/html;
            index index.html index.htm;
            server_name _;
            absolute_redirect off;

            # Redirect root and /univention paths to /univention/portal/
            location = / {
                return 301 /univention/portal/;
            }
            location = /univention {
                return 301 /univention/portal/;
            }
            location = /univention/ {
                return 301 /univention/portal/;
            }

            # Redirect paths without trailing slash to include trailing slash
            location = /univention/portal {
                return 301 /univention/portal/;
            }
            location = /univention/selfservice {
                return 301 /univention/selfservice/;
            }

            # Serve dynamic portal icons
            location /univention/portal/icons/ {
                alias /var/www/portal-assets/icons/;
                try_files $uri =404;
            }

            # Serve portal frontend under URL prefix
            location /univention/portal/ {
                try_files $uri $uri/ /univention/portal/index.html;
            }

            # Serve selfservice frontend under URL prefix
            location /univention/selfservice/ {
                try_files $uri $uri/ /univention/selfservice/index.html;
            }

            # Serve favicon files
            location = /favicon.ico {
                alias /var/www/html/favicon/favicon.ico;
            }
            location /favicon/ {
                try_files $uri =404;
            }

            # Default fallback
            location / {
                try_files $uri $uri/ =404;
            }
        }
    }
...
