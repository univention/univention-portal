---
kind: "ConfigMap"
apiVersion: "v1"
metadata:
  name: "{{ include "common.names.fullname" . }}"
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- if .Values.additionalAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.additionalAnnotations "context" . ) | nindent 4 }}
  {{- end }}
data:
  ENVIRONMENT: "{{ .Values.portalFrontend.environment }}"
  LOG_LEVEL: "{{ .Values.portalFrontend.logLevel }}"
...
---
kind: "ConfigMap"
apiVersion: "v1"
metadata:
  name: {{ printf "%s-nginx" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- if .Values.additionalAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.additionalAnnotations "context" . ) | nindent 4 }}
  {{- end }}
data:
  nginx.conf: |
    worker_processes  auto;
    error_log  /dev/stderr notice;
    pid        /var/run/nginx.pid;
    events {
        worker_connections  1024;
    }
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';
        access_log  /dev/stdout  main;
        sendfile        on;
        keepalive_timeout  65;
        #gzip  on;
        server {
            listen 80 default_server;
            {{- if not .Values.portalFrontend.nginx.disableIPv6 }}
            listen [::]:80 default_server;
            {{- end }}
            root /var/www/html;
            index index.html index.htm;
            server_name _;

            # Redirect root and /univention paths to /univention/portal/
            location = / {
                return 301 /univention/portal/;
            }
            location = /univention {
                return 301 /univention/portal/;
            }
            location = /univention/ {
                return 301 /univention/portal/;
            }

            # Handle /favicon.ico by serving from /favicon/favicon.ico
            location = /favicon.ico {
                rewrite ^/favicon.ico$ /favicon/favicon.ico last;
            }

            # Handle /univention/portal/ and /univention/selfservice/ prefixes
            # by stripping the prefix and serving files from root
            location ~ ^/univention/(portal|selfservice)/(.*)$ {
                try_files /$2 /$2/ =404;
            }

            # Default location for direct access
            location / {
                try_files $uri $uri/ =404;
            }
        }
    }
...
