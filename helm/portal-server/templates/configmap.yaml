---
kind: "ConfigMap"
apiVersion: "v1"
metadata:
  name: "{{ include "common.names.fullname" . }}"
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- if .Values.additionalAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.additionalAnnotations "context" . ) | nindent 4 }}
  {{- end }}
data:
  ENVIRONMENT: "{{ .Values.portalServer.environment }}"
  LOG_LEVEL: "{{ .Values.portalServer.logLevel }}"
  PORTAL_SERVER_ADMIN_GROUP: {{ include "portal-server.adminGroup" . | quote }}
  PORTAL_SERVER_AUTH_MODE: {{ include "portal-server.authMode" . | quote }}
  PORTAL_SERVER_EDITABLE: "{{ .Values.portalServer.editable }}"
  PORTAL_SERVER_FEATURE_TOGGLES: {{ .Values.portalServer.featureToggles | default dict | toJson | quote }}
  {{- $newsfeedEnabled := (.Values.portalServer.featureToggles).newsfeed | default false }}
  {{- $newsfeedConfig := ternary .Values.portalServer.newsfeed dict $newsfeedEnabled }}
  PORTAL_SERVER_NEWSFEED_CONFIG: {{ $newsfeedConfig | default dict | toJson | quote }}
  PORTAL_SERVER_PORT: "{{ .Values.service.ports.http.port }}"
  PORTAL_SERVER_UCS_INTERNAL_PATH: {{ required "The parameter \"portalServer.ucsInternalPath\" is required." .Values.portalServer.ucsInternalPath | quote }}
  PORTAL_SERVER_UMC_GET_URL: {{ include "portal-server.umcGetUrl" . | quote }}
  PORTAL_SERVER_UMC_SESSION_URL: {{ include "portal-server.umcSessionUrl" .| quote }}
  PORTAL_SERVER_CENTRAL_NAVIGATION_ENABLED: {{ ternary "true" "false" .Values.portalServer.centralNavigation.enabled | quote }}
  {{- $udmConnectionUrl := required
        "The UDM Rest API connection has to be configured, udm.connection.url."
        (coalesce .Values.udm.connection.url .Values.global.udm.connection.url) }}
  PORTAL_UDM_API_URL: {{ tpl $udmConnectionUrl . | quote }}
  {{- $udmAuthUsername := required "A UDM username is required, see parameter udm.auth." .Values.udm.auth.username }}
  PORTAL_UDM_API_USERNAME: {{ tpl $udmAuthUsername . | quote }}
  PORTAL_UDM_API_PASSWORD_FILE: "/var/secrets/udm_api_password"
  OBJECT_STORAGE_ENDPOINT: {{ tpl ( required "The parameter \"objectStorage.endpoint\" is required." .Values.objectStorage.endpoint ) . | quote }}
  OBJECT_STORAGE_BUCKET: {{ tpl .Values.objectStorage.bucketName . | quote }}
  {{- $guardianEnabled := (.Values.portalServer.featureToggles).guardian_authorization | default false }}
  {{- $guardianBaseConfig := omit (.Values.portalServer.guardian | default dict) "auth" }}
  {{- $guardianConfigJson := dict "enabled" $guardianEnabled | merge $guardianBaseConfig | toJson }}
  PORTAL_SERVER_GUARDIAN_CONFIG: {{ tpl $guardianConfigJson . | quote }}
