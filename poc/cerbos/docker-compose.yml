services:
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.46.0
    container_name: cerbos-poc
    command: ["server", "--config=/config/cerbos.yaml"]
    ports:
      - "3592:3592"  # HTTP
      - "3593:3593"  # gRPC
    volumes:
      - ./policies:/policies:ro
      - ./cerbos.yaml:/config/cerbos.yaml:ro
