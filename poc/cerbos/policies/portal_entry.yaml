#
# PoC policy for portal:entry visibility.
#
# Integration model: OR-union with the legacy portal filter. The portal
# computes its own visible-tiles set; Cerbos computes its own set; the two
# are unioned. A tile is shown if either system approves.
#
# Consequences for this policy:
#   - No pass-through rule. Cerbos default-denies tiles it doesn't
#     recognize -- they're covered by the portal's legacy logic.
#   - Cerbos can only ADD allows; it cannot restrict the portal.
#   - Rules describe specific tiles and the conditions under which Cerbos
#     wants them visible.
#
# Contract per CheckResources call:
#   - principal: id=DN, roles=guardianRoles+inherited, attr=all UDM props
#   - resources: every candidate entry as kind=portal:entry, id=DN,
#     attr=all UDM entry properties
#   - action: "view"
---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: portal:entry
  rules:
    # OX Mail tile: visible iff the user is an OX user.
    - actions: [view]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          expr: R.attr.name == "ox_mail" && P.attr.isOxUser == true

    # Nextcloud tile: visible iff the user has Nextcloud enabled.
    - actions: [view]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          expr: R.attr.name == "nextcloud" && P.attr.nextcloudEnabled == true

    # Teacher-targeted tiles: visible iff the user holds the portal teacher
    # role.
    - actions: [view]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          expr: |
            R.attr.name in ["moodle", "itslearning", "sofatutor", "veyon", "teacher-documentation"]
            && "univention-portal:portal:teacher" in P.roles

    # Demo "service-NN" tiles tile11..tile33: visible to anyone with the
    # authenticated-user role. Demonstrates name-prefix matching, not a
    # serious gate.
    - actions: [view]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          expr: |
            R.attr.name.startsWith("tile")
            && "univention-portal:portal:authenticated-user" in P.roles

    # Super-admins see everything (escape hatch).
    - actions: [view]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          expr: '"guardian:builtin:super-admin" in P.roles'
