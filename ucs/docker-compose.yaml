version: '3.1'

services:
  portal-server:
    container_name: univention-portal-server
    image: __IMAGE_REGISTRY__/portal-server:__IMAGE_TAG__
    security_opt:
      - seccomp:/etc/docker/seccomp-systemd.json
    restart: unless-stopped  # on-failure
    env_file: /etc/univention-portal/server.env
    volumes:
      # TODO: Make portals.json file configurable to use ObjectStorageCache or FileCache
      - /usr/share/univention-portal:/usr/share/univention-portal
      # TODO: There is a listener module in UCS, we just need to mount the files
      - /var/cache/univention-portal:/var/cache/univention-portal
      # GroupsContentFetcher reads this through univention.ldap_cache, which
      # opens the gdbm files for writing even on a pure read. It cannot be :ro.
      - /usr/share/univention-group-membership-cache/caches:/usr/share/univention-group-membership-cache/caches
      # PORTAL_SERVER_UMC_CHECK_ICONS makes the server stat every UMC module
      # icon. Without these the check fails and every UMC tile loses its icon.
      - /usr/share/univention-management-console-frontend/js/dijit/themes/umc/icons:/usr/share/univention-management-console-frontend/js/dijit/themes/umc/icons:ro
      - /etc/univention/ssl/ucsCA/CAcert.pem:/etc/univention/ssl/ucsCA/CAcert.pem:ro
      - /etc/machine.secret:/etc/machine.secret:ro
    ports:
      - "8095:80"
  portal-frontend:
    container_name: univention-portal-frontend
    image: __IMAGE_REGISTRY__/portal-frontend:__IMAGE_TAG__
    security_opt:
      - seccomp:/etc/docker/seccomp-systemd.json
    restart: unless-stopped  # on-failure
    env_file: /etc/univention-portal/server.env
    volumes:
      - /etc/univention/ssl/ucsCA/CAcert.pem:/etc/univention/ssl/ucsCA/CAcert.pem:ro
    ports:
      - "8080:80"
