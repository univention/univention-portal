---
action: create
module: users/ldap
position: cn=users,{{ ldapBaseDn }}
properties:
  username: "svc-portal-server"
  password: {{ svcPortalServerUserPassword }}
  description: "Service account for the Portal Server"
  overridePWHistory: true
  overridePWLength: true
---
action: ensure_list_contains
module: groups/group
position: cn=Domain Service Users,cn=groups,{{ ldapBaseDn }}
properties:
  users:
    - uid=svc-portal-server,cn=users,{{ ldapBaseDn }}
---
# Delegated UDM administration asks Cerbos about every request; without a role the portal server is denied.
action: ensure_list_contains
module: users/ldap
position: uid=svc-portal-server,cn=users,{{ ldapBaseDn }}
properties:
  guardianRoles:
    - "udm:default-roles:domain-administrator"
